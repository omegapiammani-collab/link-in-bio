name: Bootstrap vinext for Cloudflare preview
on:
  push:
    paths:
      - .github/workflows/vinext-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/feature/phase-1-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing dependencies
        run: npm install --no-audit --no-fund
      - name: Check vinext compatibility (informational)
        run: npx --yes vinext check
        continue-on-error: true
      - name: Initialize vinext Cloudflare target (no prompts)
        run: npx --yes vinext init --platform=cloudflare
        env:
          CI: 'true'
      - name: Build vinext output
        run: npm run build:vinext
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mmbhuxiejfqipttyujop.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_only
          OWNER_AUTH_USER_ID: 00000000-0000-0000-0000-000000000000
      - name: Commit generated configuration to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vite.config.ts cloudflare.config.ts wrangler.jsonc wrangler.json .gitignore 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "build: initialize vinext Cloudflare Workers configuration"
            git push origin HEAD:feature/phase-1-foundation
          fi
